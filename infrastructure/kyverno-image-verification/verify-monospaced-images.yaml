# Admit an image from ghcr.io/monospaced-dev/ only if it carries a cosign
# keyless signature made by that repo's build-sign.yml workflow on main.
#
# ImageValidatingPolicy, not a legacy ClusterPolicy with verifyImages: cosign
# v3 writes only Sigstore bundles (OCI referrers), and the legacy path looks
# for the old .sig tag, so it reports "no signatures found" for every image.
#
# Opt-in per namespace: a namespace labelled
#   security.robotoh.io/verify-images: enforce
# is covered. Everything else stays in the cluster-wide Audit posture until
# phase 4.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-monospaced-images
spec:
  validationActions: [Deny]
  # Enforce at admission only. Background re-scans run in the reports
  # controller, which has no internet egress (only the admission controller
  # does), so they failed with "connection refused" to ghcr.io and showed up
  # as PolicyViolation events on running pods. A pod's image can't change
  # after admission, so re-checking it in the background adds nothing.
  evaluation:
    background:
      enabled: false
  failurePolicy: Fail
  webhookConfiguration:
    # The Kubernetes maximum. Each of our images costs a GHCR + Sigstore
    # round trip, and the app pod has three container slots (init + fpm +
    # nginx); 15s was not enough on a cold cache.
    timeoutSeconds: 30
  matchConstraints:
    namespaceSelector:
      matchLabels:
        security.robotoh.io/verify-images: enforce
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        operations: [CREATE, UPDATE]
  matchImageReferences:
    - glob: "ghcr.io/monospaced-dev/*"
  # Our images must already be pinned by digest (checked below), so Kyverno
  # never has to resolve a tag. Tag resolution was also broken for us: the
  # images are arm64-only indexes, and Kyverno's resolver looks for a
  # linux/amd64 child ("no child with platform linux/amd64 in index").
  validationConfigurations:
    mutateDigest: false
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/monospaced-dev/[^/]+/\.github/workflows/build-sign\.yml@refs/heads/main$'
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    # `images` maps each container kind (containers, initContainers,
    # ephemeralContainers) to its image list. Iterating every kind closes a
    # gap: checking only images.containers would let an unsigned image in
    # through an init container.
    #
    # Tags are mutable; a digest names exactly one image. Deploy by digest.
    - expression: >-
        images.all(kind, images[kind]
          .filter(image, image.startsWith('ghcr.io/monospaced-dev/'))
          .all(image, image.contains('@sha256:')))
      message: "Images from ghcr.io/monospaced-dev/ must be pinned by digest (image@sha256:...), not a tag"
    # Only our own images are checked; third-party images in the same
    # namespace (e.g. postgres) pass through. An empty list is vacuously true.
    - expression: >-
        images.all(kind, images[kind]
          .filter(image, image.startsWith('ghcr.io/monospaced-dev/'))
          .all(image, verifyImageSignatures(image, [attestors.github]) > 0))
      message: "Image from ghcr.io/monospaced-dev/ is not signed by its build-sign.yml workflow on main"
