apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: family-budget
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: family-budget
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# The app, the migrate Job and the backup Job may talk to Postgres, and nothing else.
# No internet, no Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clients-to-postgres
  namespace: family-budget
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [family-budget]}
      - {key: app.kubernetes.io/component, operator: In, values: [app, migrate, backup]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: family-budget
              app.kubernetes.io/component: postgres
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-clients
  namespace: family-budget
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: family-budget
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [family-budget]}
              - {key: app.kubernetes.io/component, operator: In, values: [app, migrate, backup]}
      ports:
        - {protocol: TCP, port: 5432}
---
# Traefik is the only thing that may reach the app (port 8080). Traefik's own policy already lets
# it talk to any namespace; this is the other half of that handshake.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-from-traefik
  namespace: family-budget
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: family-budget
      app.kubernetes.io/component: app
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 8080}
