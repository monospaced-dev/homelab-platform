# Runs `php artisan migrate --force` on every sync, before the app rolls out.
# A Sync-phase hook at wave 2: Argo waits for wave 1 (Postgres) to be healthy first.
apiVersion: batch/v1
kind: Job
metadata:
  name: family-budget-migrate
  namespace: family-budget
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: family-budget
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Same fpm image as the app, by digest (Kyverno requires it).
          image: ghcr.io/monospaced-dev/family-budget-fpm@sha256:88f43cc78a64d0ca4842a364dc4efe4bdd9127e2f17eb2048dc8690cc0053d7c
          command:
            - sh
            - -c
            # Wait until Postgres accepts a real connection before migrating. k3s's NetworkPolicy
            # controller needs a few seconds to add a new pod's IP to its allow-lists; until then
            # default-deny rejects the pod's traffic. The app pod rides this out through its
            # readiness probe; a one-shot Job has to wait itself.
            - |
              mkdir -p storage/framework/cache storage/framework/sessions \
                storage/framework/views storage/logs storage/app/private
              i=0
              until php -r 'try { new PDO("pgsql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD")); } catch (Throwable $e) { exit(1); }'; do
                i=$((i+1))
                if [ "$i" -ge 30 ]; then echo "postgres unreachable after 60s" >&2; exit 1; fi
                echo "waiting for postgres ($i)..."
                sleep 2
              done
              echo "postgres reachable after $i retries"
              exec php artisan migrate --force
          envFrom:
            - configMapRef:
                name: family-budget-env
            - secretRef:
                name: family-budget-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
