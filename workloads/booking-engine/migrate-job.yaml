# Runs `php artisan migrate --force` on every sync, before the app rolls out.
# A Sync-phase hook at wave 2: Argo waits for wave 1 (Postgres) to be healthy
# first. (The old cluster used PreSync, which runs before anything else, so on
# a fresh namespace it failed: no Postgres and no secret yet.)
apiVersion: batch/v1
kind: Job
metadata:
  name: booking-engine-migrate
  namespace: booking-engine
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-engine
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Same fpm image as the app, by digest (Kyverno requires it).
          image: ghcr.io/monospaced-dev/booking-engine-fpm@sha256:af679b7e1d9a8b0cdfa464d4f01cf0dccdd7cb8f148639561fb604911367660c
          command:
            - sh
            - -c
            # Wait until Postgres accepts a real connection before migrating.
            # k3s's NetworkPolicy controller needs a few seconds to add a new
            # pod's IP to its allow-lists; until then default-deny rejects the
            # pod's traffic ("connection refused"). The app pod rides this out
            # through its readiness probe; a one-shot Job has to wait itself.
            - |
              mkdir -p storage/framework/cache storage/framework/sessions \
                storage/framework/views storage/logs storage/app/private
              i=0
              until php -r 'try { new PDO("pgsql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE"), getenv("DB_USERNAME"), getenv("DB_PASSWORD")); } catch (Throwable $e) { exit(1); }'; do
                i=$((i+1))
                if [ "$i" -ge 30 ]; then echo "postgres unreachable after 60s" >&2; exit 1; fi
                echo "waiting for postgres ($i)..."
                sleep 2
              done
              echo "postgres reachable after $i retries"
              exec php artisan migrate --force
          envFrom:
            - configMapRef:
                name: booking-engine-env
            - secretRef:
                name: booking-engine-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
