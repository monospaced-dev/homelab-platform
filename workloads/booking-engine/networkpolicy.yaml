apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: booking-engine
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: booking-engine
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# The app and the migrate Job may talk to Postgres, and nothing else.
# No internet, no Kubernetes API. No ingress to the app yet: it's internal
# only, and its one consumer (inspector-service) is paused. Add an ingress
# rule from that namespace when it comes back.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-to-postgres
  namespace: booking-engine
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [booking-engine]}
      - {key: app.kubernetes.io/component, operator: In, values: [app, migrate]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: booking-engine
              app.kubernetes.io/component: postgres
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-app
  namespace: booking-engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: booking-engine
      app.kubernetes.io/component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [booking-engine]}
              - {key: app.kubernetes.io/component, operator: In, values: [app, migrate]}
      ports:
        - {protocol: TCP, port: 5432}
