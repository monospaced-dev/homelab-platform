apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno-policies
    targetRevision: 3.9.1
    helm:
      valuesObject:
        podSecurityStandard: restricted
        # Phase 4 (Sept 27, 2026): Audit -> Enforce, after a pre-flight showed
        # 0 fail / 0 error across every PolicyReport. Documented exceptions
        # in infrastructure/kyverno-exceptions still apply.
        # Rollback: set this back to Audit and push.
        validationFailureAction: Enforce
        # If Kyverno is down or slow, let the request through. Pod Security
        # Admission (namespace labels, built into the API server) still
        # enforces the restricted profile everywhere except kube-system and
        # the documented privileged namespaces, so a Kyverno outage degrades
        # to PSA-only rather than blocking every pod in the cluster.
        # (The chart default is Fail; the phase 1 notes assumed Ignore, but it
        # was never set.) The image-signature policy keeps Fail on purpose.
        failurePolicy: Ignore
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m